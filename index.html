<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agar.io Elite Edition</title>
    <style>
        body {
            margin: 0;
            background: #0d0d0d;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        canvas {
            display: block;
            background: #141414;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 18px;
            font-weight: bold;
            background: rgba(15, 15, 15, 0.75);
            padding: 12px 20px;
            border-radius: 12px;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: none;
        }
        #leaderboard {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            background: rgba(15, 15, 15, 0.75);
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: none;
        }
        #leaderboard h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            text-align: center;
            color: #ff5722;
            letter-spacing: 1px;
        }
        .lb-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-weight: 500;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 15, 15, 0.75);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
            display: none;
        }
        /* Menu overlay styling */
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 13, 13, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #menu-box {
            background: rgba(25, 25, 25, 0.9);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            width: 320px;
        }
        #menu-box h1 {
            margin-top: 0;
            color: #ff5722;
            font-size: 28px;
            letter-spacing: 2px;
        }
        #usernameInput {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            box-sizing: border-box;
        }
        #usernameInput:focus {
            outline: none;
            border-color: #ff5722;
        }
        #playBtn {
            width: 100%;
            padding: 12px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        #playBtn:hover {
            background: #e64a19;
        }
    </style>
</head>
<body>
    <!-- Start Screen Menu -->
    <div id="menu">
        <div id="menu-box">
            <h1>AGAR.IO ELITE</h1>
            <input type="text" id="usernameInput" placeholder="Enter your nickname" maxlength="15" value="Player">
            <button id="playBtn">Play Game</button>
        </div>
    </div>

    <div id="hud">Mass: <span id="mass">20</span></div>
    <div id="leaderboard">
        <h3>TOP CELLS</h3>
        <div id="lb-list"></div>
    </div>
    <div id="instructions">Controls: <b>Mouse</b> to move | <b>Space</b> to Split | <b>W</b> to Eject Mass</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        const MAP_SIZE = 3500;

        let player = {
            x: MAP_SIZE / 2,
            y: MAP_SIZE / 2,
            radius: 22,
            color: '#ff5722',
            speed: 2.2,
            name: "You"
        };

        let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        let camera = { x: player.x, y: player.y, zoom: 0.5 }; // Much more zoomed-out perspective by default
        let gameStarted = false;

        document.getElementById('playBtn').addEventListener('click', () => {
            let customName = document.getElementById('usernameInput').value.trim();
            if (customName) player.name = customName;

            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('leaderboard').style.display = 'block';
            document.getElementById('instructions').style.display = 'block';
            gameStarted = true;
        });

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        let ejectedMass = [];

        window.addEventListener('keydown', (e) => {
            if (!gameStarted) return;
            if (e.code === 'Space' && player.radius > 35) {
                player.radius -= 12;
            }
            if (e.code === 'KeyW' && player.radius > 25) {
                player.radius -= 3;
                let dx = mouse.x - canvas.width / 2;
                let dy = mouse.y - canvas.height / 2;
                let dist = Math.hypot(dx, dy) || 1;
                ejectedMass.push({
                    x: player.x + (dx / dist) * (player.radius + 15),
                    y: player.y + (dy / dist) * (player.radius + 15),
                    vx: (dx / dist) * 7,
                    vy: (dy / dist) * 7,
                    radius: 6,
                    color: player.color
                });
            }
        });

        let foods = [];
        for (let i = 0; i < 600; i++) {
            foods.push({
                x: Math.random() * MAP_SIZE,
                y: Math.random() * MAP_SIZE,
                radius: 4.5,
                color: `hsl(${Math.random() * 360}, 90%, 65%)`
            });
        }

        let viruses = [];
        for (let i = 0; i < 18; i++) {
            viruses.push({
                x: Math.random() * (MAP_SIZE - 300) + 150,
                y: Math.random() * (MAP_SIZE - 300) + 150,
                radius: 50,
                color: '#2ecc71'
            });
        }

        let bots = [];
        const botNames = ["Alpha", "Blobber", "Venom", "Titan", "Cosmo", "Goliath", "Zeus", "Vortex", "Shadow", "Apex", "Juggernaut", "Pulse"];
        for (let i = 0; i < 40; i++) {
            bots.push({
                x: Math.random() * MAP_SIZE,
                y: Math.random() * MAP_SIZE,
                radius: Math.random() * 30 + 15,
                color: `hsl(${Math.random() * 360}, 75%, 50%)`,
                vx: (Math.random() - 0.5) * 1.8,
                vy: (Math.random() - 0.5) * 1.8,
                name: botNames[i % botNames.length]
            });
        }

        function update() {
            if (!gameStarted) return;

            let dx = mouse.x - canvas.width / 2;
            let dy = mouse.y - canvas.height / 2;
            let dist = Math.hypot(dx, dy);

            if (dist > 1) {
                player.x += (dx / dist) * player.speed;
                player.y += (dy / dist) * player.speed;
            }

            player.x = Math.max(player.radius, Math.min(MAP_SIZE - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(MAP_SIZE - player.radius, player.y));

            player.speed = Math.max(1.1, 3.2 - (player.radius / 50));

            // Wider zoomed-out target perspective calculation
            let targetZoom = Math.max(0.25, 90 / player.radius);
            camera.zoom += (targetZoom - camera.zoom) * 0.06;
            camera.x += (player.x - camera.x) * 0.1;
            camera.y += (player.y - camera.y) * 0.1;

            for (let i = ejectedMass.length - 1; i >= 0; i--) {
                let em = ejectedMass[i];
                em.x += em.vx;
                em.y += em.vy;
                em.vx *= 0.92;
                em.vy *= 0.92;

                if (Math.hypot(player.x - em.x, player.y - em.y) < player.radius) {
                    player.radius += 0.4;
                    ejectedMass.splice(i, 1);
                }
            }

            for (let i = foods.length - 1; i >= 0; i--) {
                let f = foods[i];
                if (Math.hypot(player.x - f.x, player.y - f.y) < player.radius) {
                    player.radius += 0.05;
                    foods.splice(i, 1);
                    foods.push({
                        x: Math.random() * MAP_SIZE,
                        y: Math.random() * MAP_SIZE,
                        radius: 4.5,
                        color: `hsl(${Math.random() * 360}, 90%, 65%)`
                    });
                }
            }

            bots.forEach(bot => {
                bot.x += bot.vx;
                bot.y += bot.vy;

                if (bot.x < 0 || bot.x > MAP_SIZE) bot.vx *= -1;
                if (bot.y < 0 || bot.y > MAP_SIZE) bot.vy *= -1;

                if (Math.random() < 0.015) {
                    bot.vx = (Math.random() - 0.5) * 2;
                    bot.vy = (Math.random() - 0.5) * 2;
                }

                let d = Math.hypot(player.x - bot.x, player.y - bot.y);
                if (d < player.radius + bot.radius) {
                    if (player.radius > bot.radius * 1.1) {
                        player.radius += bot.radius * 0.12;
                        bot.x = Math.random() * MAP_SIZE;
                        bot.y = Math.random() * MAP_SIZE;
                        bot.radius = Math.random() * 30 + 15;
                    } else if (bot.radius > player.radius * 1.1) {
                        alert("You were absorbed! Restarting game.");
                        player.radius = 22;
                        player.x = MAP_SIZE / 2;
                        player.y = MAP_SIZE / 2;
                    }
                }
            });

            viruses.forEach(v => {
                if (Math.hypot(player.x - v.x, player.y - v.y) < player.radius + v.radius) {
                    if (player.radius > v.radius) {
                        player.radius = Math.max(22, player.radius - 18);
                        v.x = Math.random() * (MAP_SIZE - 300) + 150;
                        v.y = Math.random() * (MAP_SIZE - 300) + 150;
                    }
                }
            });

            let currentMass = Math.floor(player.radius * player.radius * 0.1);
            document.getElementById('mass').innerText = currentMass;
            updateLeaderboard(currentMass);
        }

        function updateLeaderboard(playerMass) {
            let allEntities = [{ name: player.name, mass: playerMass }];
            bots.forEach(b => allEntities.push({ name: b.name, mass: Math.floor(b.radius * b.radius * 0.1) }));
            allEntities.sort((a, b) => b.mass - a.mass);

            let html = "";
            for (let i = 0; i < Math.min(5, allEntities.length); i++) {
                let colorStyle = allEntities[i].name === player.name ? "color: #ff5722; font-weight: bold;" : "";
                html += `<div class="lb-item"><span style="${colorStyle}">${i+1}. ${allEntities[i].name}</span><span>${allEntities[i].mass}</span></div>`;
            }
            document.getElementById('lb-list').innerHTML = html;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!gameStarted) return;

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(camera.zoom, camera.zoom);
            ctx.translate(-camera.x, -camera.y);

            ctx.strokeStyle = '#1b1b1b';
            ctx.lineWidth = 1.5;
            for (let x = 0; x < MAP_SIZE; x += 90) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
            }
            for (let y = 0; y < MAP_SIZE; y += 90) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
            }

            foods.forEach(f => {
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fillStyle = f.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = f.color;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.closePath();
            });

            ejectedMass.forEach(em => {
                ctx.beginPath();
                ctx.arc(em.x, em.y, em.radius, 0, Math.PI * 2);
                ctx.fillStyle = em.color;
                ctx.fill();
                ctx.closePath();
            });

            viruses.forEach(v => {
                ctx.beginPath();
                ctx.arc(v.x, v.y, v.radius, 0, Math.PI * 2);
                ctx.fillStyle = v.color;
                ctx.lineWidth = 5;
                ctx.strokeStyle = '#27ae60';
                ctx.fill();
                ctx.stroke();
                ctx.closePath();
            });

            bots.forEach(bot => {
                ctx.beginPath();
                ctx.arc(bot.x, bot.y, bot.radius, 0, Math.PI * 2);
                ctx.fillStyle = bot.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = 'rgba(0,0,0,0.4)';
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.closePath();

                ctx.fillStyle = '#fff';
                ctx.font = `${Math.max(12, bot.radius * 0.38)}px 'Segoe UI', sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(bot.name, bot.x, bot.y + 4);
            });

            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(255, 87, 34, 0.6)';
            ctx.fill();
            ctx.lineWidth = 5;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.closePath();

            ctx.fillStyle = '#fff';
            ctx.font = `${Math.max(14, player.radius * 0.38)}px 'Segoe UI', sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText(player.name, player.x, player.y + 4);

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
