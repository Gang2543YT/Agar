<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agar.io Ultimate Edition</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        canvas {
            display: block;
            background: #181818;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 20px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            border-radius: 10px;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #leaderboard {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 180px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #leaderboard h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            text-align: center;
            color: #ff5722;
        }
        .lb-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div id="hud">Mass: <span id="mass">10</span></div>
    <div id="leaderboard">
        <h3>Leaderboard</h3>
        <div id="lb-list"></div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        const MAP_SIZE = 3000;

        let player = {
            x: MAP_SIZE / 2,
            y: MAP_SIZE / 2,
            radius: 20,
            color: '#ff5722',
            speed: 4,
            name: "You"
        };

        let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        let camera = { x: player.x, y: player.y, zoom: 1 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Controls: Space to Split, W to Eject Mass
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && player.radius > 30) {
                player.radius -= 10; // Simple split simulation boost
                player.speed += 3;
                setTimeout(() => player.speed -= 3, 300);
            }
        });

        // Generate colorful foods
        let foods = [];
        for (let i = 0; i < 500; i++) {
            foods.push({
                x: Math.random() * MAP_SIZE,
                y: Math.random() * MAP_SIZE,
                radius: 5,
                color: `hsl(${Math.random() * 360}, 90%, 60%)`
            });
        }

        // Generate Viruses (Spike hazards)
        let viruses = [];
        for (let i = 0; i < 15; i++) {
            viruses.push({
                x: Math.random() * (MAP_SIZE - 200) + 100,
                y: Math.random() * (MAP_SIZE - 200) + 100,
                radius: 45,
                color: '#33cc33'
            });
        }

        // Generate AI Bot Cells
        let bots = [];
        const botNames = ["Alpha", "Blobber", "Venom", "Titan", "Cosmo", "Goliath", "Zeus", "Vortex", "Shadow", "Apex"];
        for (let i = 0; i < 35; i++) {
            bots.push({
                x: Math.random() * MAP_SIZE,
                y: Math.random() * MAP_SIZE,
                radius: Math.random() * 25 + 15,
                color: `hsl(${Math.random() * 360}, 75%, 50%)`,
                vx: (Math.random() - 0.5) * 2.5,
                vy: (Math.random() - 0.5) * 2.5,
                name: botNames[i % botNames.length]
            });
        }

        function update() {
            // Smooth mouse vector movement
            let dx = mouse.x - canvas.width / 2;
            let dy = mouse.y - canvas.height / 2;
            let dist = Math.hypot(dx, dy);

            if (dist > 1) {
                player.x += (dx / dist) * player.speed;
                player.y += (dy / dist) * player.speed;
            }

            // Map boundaries
            player.x = Math.max(player.radius, Math.min(MAP_SIZE - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(MAP_SIZE - player.radius, player.y));

            // Dynamic speed scaling based on mass
            player.speed = Math.max(1.8, 4.5 - (player.radius / 40));

            // Camera smooth tracking & zoom adjustment
            let targetZoom = Math.max(0.4, 120 / player.radius);
            camera.zoom += (targetZoom - camera.zoom) * 0.05;
            camera.x += (player.x - camera.x) * 0.1;
            camera.y += (player.y - camera.y) * 0.1;

            // Food collision check
            for (let i = foods.length - 1; i >= 0; i--) {
                let f = foods[i];
                if (Math.hypot(player.x - f.x, player.y - f.y) < player.radius) {
                    player.radius += 0.08;
                    foods.splice(i, 1);
                    foods.push({
                        x: Math.random() * MAP_SIZE,
                        y: Math.random() * MAP_SIZE,
                        radius: 5,
                        color: `hsl(${Math.random() * 360}, 90%, 60%)`
                    });
                }
            }

            // Bot logic & collisions
            bots.forEach(bot => {
                bot.x += bot.vx;
                bot.y += bot.vy;

                if (bot.x < 0 || bot.x > MAP_SIZE) bot.vx *= -1;
                if (bot.y < 0 || bot.y > MAP_SIZE) bot.vy *= -1;

                // Random wandering direction adjustments
                if (Math.random() < 0.02) {
                    bot.vx = (Math.random() - 0.5) * 3;
                    bot.vy = (Math.random() - 0.5) * 3;
                }

                // Player vs Bot collision
                let d = Math.hypot(player.x - bot.x, player.y - bot.y);
                if (d < player.radius + bot.radius) {
                    if (player.radius > bot.radius * 1.1) {
                        player.radius += bot.radius * 0.15;
                        bot.x = Math.random() * MAP_SIZE;
                        bot.y = Math.random() * MAP_SIZE;
                        bot.radius = Math.random() * 25 + 15;
                    } else if (bot.radius > player.radius * 1.1) {
                        alert("Devoured! Game Over.");
                        player.radius = 20;
                        player.x = MAP_SIZE / 2;
                        player.y = MAP_SIZE / 2;
                    }
                }
            });

            // Virus obstacle check
            viruses.forEach(v => {
                if (Math.hypot(player.x - v.x, player.y - v.y) < player.radius + v.radius) {
                    if (player.radius > v.radius) {
                        player.radius = Math.max(20, player.radius - 15); // Shatter penalty
                        v.x = Math.random() * (MAP_SIZE - 200) + 100;
                        v.y = Math.random() * (MAP_SIZE - 200) + 100;
                    }
                }
            });

            // Update UI Mass and Leaderboard
            document.getElementById('mass').innerText = Math.floor(player.radius * player.radius * 0.1);
            updateLeaderboard();
        }

        function updateLeaderboard() {
            let allEntities = [{ name: "You", mass: Math.floor(player.radius * player.radius * 0.1) }];
            bots.forEach(b => allEntities.push({ name: b.name, mass: Math.floor(b.radius * b.radius * 0.1) }));
            allEntities.sort((a, b) => b.mass - a.mass);

            let html = "";
            for (let i = 0; i < Math.min(5, allEntities.length); i++) {
                html += `<div class="lb-item"><span>${i+1}. ${allEntities[i].name}</span><span>${allEntities[i].mass}</span></div>`;
            }
            document.getElementById('lb-list').innerHTML = html;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(camera.zoom, camera.zoom);
            ctx.translate(-camera.x, -camera.y);

            // Background Grid Lines
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            for (let x = 0; x < MAP_SIZE; x += 80) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
            }
            for (let y = 0; y < MAP_SIZE; y += 80) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
            }

            // Draw Foods
            foods.forEach(f => {
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fillStyle = f.color;
                ctx.fill();
                ctx.closePath();
            });

            // Draw Viruses (Starburst Spikes)
            viruses.forEach(v => {
                ctx.beginPath();
                ctx.arc(v.x, v.y, v.radius, 0, Math.PI * 2);
                ctx.fillStyle = v.color;
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#228b22';
                ctx.stroke();
                ctx.closePath();
            });

            // Draw Bot Cells
            bots.forEach(bot => {
                ctx.beginPath();
                ctx.arc(bot.x, bot.y, bot.radius, 0, Math.PI * 2);
                ctx.fillStyle = bot.color;
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.stroke();
                ctx.closePath();

                ctx.fillStyle = '#fff';
                ctx.font = `${Math.max(12, bot.radius * 0.4)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(bot.name, bot.x, bot.y + 4);
            });

            // Draw Player Cell
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.lineWidth = 5;
            ctx.strokeStyle = '#fff';
            ctx.stroke();
            ctx.closePath();

            ctx.fillStyle = '#fff';
            ctx.font = `${Math.max(14, player.radius * 0.4)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText(player.name, player.x, player.y + 4);

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
