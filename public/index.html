<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agar.io Classic Replica</title>
    <style>
        body {
            margin: 0;
            background: #f2f2f2;
            color: #333;
            font-family: 'Ubuntu', 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        canvas {
            display: block;
            background: #fbfbfb;
        }
        #hud {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            pointer-events: none;
            display: none;
        }
        #leaderboard {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
            display: none;
        }
        #leaderboard h4 {
            margin: 0 0 8px 0;
            text-align: center;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        .lb-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        /* Classic Agar.io Menu Overlay */
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #202020 0%, #0a0a0a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #menu-panel {
            background: rgba(30, 30, 30, 0.9);
            padding: 35px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        #menu-panel h1 {
            color: #fff;
            margin-top: 0;
            font-size: 32px;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        #nickInput {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #111;
            border: 2px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            box-sizing: border-box;
        }
        #nickInput:focus {
            outline: none;
            border-color: #3498db;
        }
        #playButton {
            width: 100%;
            padding: 12px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        #playButton:hover {
            background: #27ae60;
        }
    </style>
</head>
<body>
    <div id="menu">
        <div id="menu-panel">
            <h1>agar.io</h1>
            <input type="text" id="nickInput" placeholder="Cell Nickname" maxlength="15" value="Player">
            <button id="playButton">Play</button>
        </div>
    </div>

    <div id="hud">Score: <span id="score">20</span></div>
    <div id="leaderboard">
        <h4>Leaderboard</h4>
        <div id="lb-list"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        const MAP_SIZE = 4000;
        let gameStarted = false;

        let playerCells = [];
        let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        let camera = { x: MAP_SIZE / 2, y: MAP_SIZE / 2, zoom: 0.5 };
        let playerName = "Player";

        document.getElementById('playButton').addEventListener('click', () => {
            let inputVal = document.getElementById('nickInput').value.trim();
            if (inputVal) playerName = inputVal;

            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('leaderboard').style.display = 'block';

            // Initialize player main cell
            playerCells = [{
                x: MAP_SIZE / 2 + (Math.random() - 0.5) * 200,
                y: MAP_SIZE / 2 + (Math.random() - 0.5) * 200,
                radius: 22,
                color: '#3498db',
                vx: 0,
                vy: 0
            }];
            gameStarted = true;
        });

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Spacebar to Split functionality
        window.addEventListener('keydown', (e) => {
            if (!gameStarted) return;
            if (e.code === 'Space') {
                let newCells = [];
                playerCells.forEach(cell => {
                    if (cell.radius > 30) {
                        cell.radius /= Math.sqrt(2);
                        let dx = mouse.x - canvas.width / 2;
                        let dy = mouse.y - canvas.height / 2;
                        let dist = Math.hypot(dx, dy) || 1;
                        newCells.push({
                            x: cell.x + (dx / dist) * (cell.radius * 2),
                            y: cell.y + (dy / dist) * (cell.radius * 2),
                            radius: cell.radius,
                            color: cell.color,
                            vx: (dx / dist) * 12,
                            vy: (dy / dist) * 12
                        });
                    }
                });
                playerCells.push(...newCells);
            }
            if (e.code === 'KeyW') {
                // Eject mass
                playerCells.forEach(cell => {
                    if (cell.radius > 25) {
                        cell.radius -= 1.5;
                        let dx = mouse.x - canvas.width / 2;
                        let dy = mouse.y - canvas.height / 2;
                        let dist = Math.hypot(dx, dy) || 1;
                        ejectedMass.push({
                            x: cell.x + (dx / dist) * (cell.radius + 15),
                            y: cell.y + (dy / dist) * (cell.radius + 15),
                            vx: (dx / dist) * 9,
                            vy: (dy / dist) * 9,
                            radius: 6,
                            color: cell.color
                        });
                    }
                });
            }
        });

        let foods = [];
        for (let i = 0; i < 700; i++) {
            foods.push({
                x: Math.random() * MAP_SIZE,
                y: Math.random() * MAP_SIZE,
                radius: 4,
                color: `hsl(${Math.random() * 360}, 85%, 55%)`
            });
        }

        let ejectedMass = [];

        let viruses = [];
        for (let i = 0; i < 20; i++) {
            viruses.push({
                x: Math.random() * (MAP_SIZE - 400) + 200,
                y: Math.random() * (MAP_SIZE - 400) + 200,
                radius: 45,
                color: '#2ecc71'
            });
        }

        let bots = [];
        const botNames = ["Celldroid", "AgarPro", "Blobby", "Mito", "Ooze", "Splasher", "Gooey", "Nucleus", "Bacter", "Titan"];
        for (let i = 0; i < 45; i++) {
            bots.push({
                x: Math.random() * MAP_SIZE,
                y: Math.random() * MAP_SIZE,
                radius: Math.random() * 30 + 15,
                color: `hsl(${Math.random() * 360}, 75%, 50%)`,
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.5,
                name: botNames[i % botNames.length]
            });
        }

        function update() {
            if (!gameStarted) return;

            // Calculate center point of all player cells for camera tracking
            let avgX = 0, avgY = 0, totalArea = 0;
            playerCells.forEach(cell => {
                let area = cell.radius * cell.radius;
                avgX += cell.x * area;
                avgY += cell.y * area;
                totalArea += area;

                // Slow mass decay over time for large cells
                if (cell.radius > 30) cell.radius -= 0.002;
            });
            let playerCenterX = avgX / totalArea;
            let playerCenterXTarget = avgX / totalArea;
            let playerCenterY = avgY / totalArea;

            // Move player cells towards mouse vector
            let dx = mouse.x - canvas.width / 2;
            let dy = mouse.y - canvas.height / 2;
            let screenDist = Math.hypot(dx, dy) || 1;

            playerCells.forEach(cell => {
                let speed = Math.max(1.0, 3.2 - (cell.radius / 45));
                cell.x += (dx / screenDist) * speed + cell.vx;
                cell.y += (dy / screenDist) * speed + cell.vy;

                // Friction decay on split velocity
                cell.vx *= 0.92;
                cell.vy *= 0.92;

                // Map boundary clamping
                cell.x = Math.max(cell.radius, Math.min(MAP_SIZE - cell.radius, cell.x));
                cell.y = Math.max(cell.radius, Math.min(MAP_SIZE - cell.radius, cell.y));
            });

            // Merge split cells back together if they touch
            for (let i = 0; i < playerCells.length; i++) {
                for (let j = i + 1; j < playerCells.length; j++) {
                    let c1 = playerCells[i];
                    let c2 = playerCells[j];
                    let dist = Math.hypot(c1.x - c2.x, c1.y - c2.y);
                    if (dist < c1.radius + c2.radius) {
                        // Absorb smaller into larger or combine
                        c1.radius = Math.sqrt(c1.radius * c1.radius + c2.radius * c2.radius);
                        playerCells.splice(j, 1);
                        j--;
                    }
                }
            }

            // Smooth camera adjustments based on collective player mass
            let maxRadius = Math.max(...playerCells.map(c => c.radius));
            let targetZoom = Math.max(0.2, 100 / maxRadius);
            camera.zoom += (targetZoom - camera.zoom) * 0.05;
            camera.x += (playerCenterX - camera.x) * 0.1;
            camera.y += (playerCenterY - camera.y) * 0.1;

            // Food consumption
            for (let i = foods.length - 1; i >= 0; i--) {
                let f = foods[i];
                playerCells.forEach(cell => {
                    if (Math.hypot(cell.x - f.x, cell.y - f.y) < cell.radius) {
                        cell.radius += 0.04;
                        foods.splice(i, 1);
                        foods.push({
                            x: Math.random() * MAP_SIZE,
                            y: Math.random() * MAP_SIZE,
                            radius: 4,
                            color: `hsl(${Math.random() * 360}, 85%, 55%)`
                        });
                    }
                });
            }

            // Bot logic & movement
            bots.forEach(bot => {
                bot.x += bot.vx;
                bot.y += bot.vy;
                if (bot.x < 0 || bot.x > MAP_SIZE) bot.vx *= -1;
                if (bot.y < 0 || bot.y > MAP_SIZE) bot.vy *= -1;

                if (Math.random() < 0.02) {
                    bot.vx = (Math.random() - 0.5) * 2;
                    bot.vy = (Math.random() - 0.5) * 2;
                }

                // Player cell vs bot collisions
                playerCells.forEach((cell, idx) => {
                    let d = Math.hypot(cell.x - bot.x, cell.y - bot.y);
                    if (d < cell.radius + bot.radius) {
                        if (cell.radius > bot.radius * 1.1) {
                            cell.radius += bot.radius * 0.15;
                            bot.x = Math.random() * MAP_SIZE;
                            bot.y = Math.random() * MAP_SIZE;
                            bot.radius = Math.random() * 30 + 15;
                        } else if (bot.radius > cell.radius * 1.1) {
                            playerCells.splice(idx, 1);
                        }
                    }
                });
            });

            if (playerCells.length === 0) {
                alert("You were eaten! Restarting...");
                location.reload();
            }

            let totalScore = Math.floor(playerCells.reduce((sum, c) => sum + c.radius * c.radius * 0.1, 0));
            document.getElementById('score').innerText = totalScore;
            updateLeaderboard(totalScore);
        }

        function updateLeaderboard(playerScore) {
            let allEntities = [{ name: playerName, score: playerScore }];
            bots.forEach(b => allEntities.push({ name: b.name, score: Math.floor(b.radius * b.radius * 0.1) }));
            allEntities.sort((a, b) => b.score - a.score);

            let html = "";
            for (let i = 0; i < Math.min(5, allEntities.length); i++) {
                let style = allEntities[i].name === playerName ? "color: #3498db; font-weight: bold;" : "";
                html += `<div class="lb-item"><span style="${style}">${i+1}. ${allEntities[i].name}</span><span>${allEntities[i].score}</span></div>`;
            }
            document.getElementById('lb-list').innerHTML = html;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!gameStarted) return;

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(camera.zoom, camera.zoom);
            ctx.translate(-camera.x, -camera.y);

            // Classic Agar.io Light Map Grid
            ctx.strokeStyle = '#e6e6e6';
            ctx.lineWidth = 1;
            for (let x = 0; x < MAP_SIZE; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
            }
            for (let y = 0; y < MAP_SIZE; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
            }

            // Draw Foods
            foods.forEach(f => {
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fillStyle = f.color;
                ctx.fill();
                ctx.closePath();
            });

            // Draw Viruses
            viruses.forEach(v => {
                ctx.beginPath();
                ctx.arc(v.x, v.y, v.radius, 0, Math.PI * 2);
                ctx.fillStyle = v.color;
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#1e8449';
                ctx.fill();
                ctx.stroke();
                ctx.closePath();
            });

            // Draw Bots
            bots.forEach(bot => {
                ctx.beginPath();
                ctx.arc(bot.x, bot.y, bot.radius, 0, Math.PI * 2);
                ctx.fillStyle = bot.color;
                ctx.lineWidth = Math.max(3, bot.radius * 0.08);
                ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                ctx.fill();
                ctx.stroke();
                ctx.closePath();

                ctx.fillStyle = '#fff';
                ctx.font = `bold ${Math.max(12, bot.radius * 0.4)}px Ubuntu, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(bot.name, bot.x, bot.y);
            });

            // Draw Player Cells
            playerCells.forEach(cell => {
                ctx.beginPath();
                ctx.arc(cell.x, cell.y, cell.radius, 0, Math.PI * 2);
                ctx.fillStyle = cell.color;
                ctx.lineWidth = Math.max(4, cell.radius * 0.08);
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.fill();
                ctx.stroke();
                ctx.closePath();

                ctx.fillStyle = '#fff';
                ctx.font = `bold ${Math.max(14, cell.radius * 0.4)}px Ubuntu, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(playerName, cell.x, cell.y);
            });

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
